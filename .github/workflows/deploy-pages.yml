name: deploy-pages

on:
  push:
    branches: [main]
    # 只改安卓工程的推送不归这里管：build-apk 会内置打包+部署（含新 APK）。
    # 若这里也跑一次，两个工作流会抢同一个 pages 并发组，互相取消。
    paths-ignore:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 必须排队而不是取消：同一次推送里 build-apk 也要部署 Pages，
  # cancel-in-progress: true 会把正在编译的 APK 任务直接掐死
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
