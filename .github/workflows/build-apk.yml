name: build-apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 与 deploy-pages 同一组串行，避免同时发布互相取消；
# 这里绝不能用 cancel-in-progress: true —— 同一次推送里 deploy-pages 先起跑，
# 会把正在编译的 APK 任务直接掐死（曾经因此拿不到新包）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 编译 debug APK（固定签名 zt-release.keystore）
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # 编译失败时把错误尾部写进公开仓库，方便不进 Actions 页面也能定位问题
      - name: 失败时导出编译日志
        if: failure()
        run: |
          mkdir -p apk
          {
            echo "构建失败：$(date -u)"
            echo "=== 错误行 ==="
            grep -nE "error:|error;|What went wrong|Execution failed|Caused by:|^e: |cannot find symbol|符号" /tmp/build.log 2>/dev/null | head -60
            echo
            echo "=== 编译任务输出（前 80 行）==="
            grep -nE "^> Task .*javac|^> Task .*Compile|\.java:" /tmp/build.log 2>/dev/null | head -80
          } > apk/build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk/build-error.txt
          git commit -m "记录编译失败日志" || true
          git push || true

      - name: 重命名产物
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/zhongtian-admin.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zhongtian-admin-apk
          path: android/app/build/outputs/apk/debug/zhongtian-admin.apk

      - name: 放进站点目录（走自己的域名下载，国内更稳）
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/zhongtian-admin.apk apk/zhongtian-admin.apk
          ls -lh apk/

      # App 内自动更新读的就是这个文件：网页/原生拿它跟本机 versionCode 比大小
      - name: 生成版本描述 apk/version.json
        run: |
          CODE=$(grep -oE 'versionCode[[:space:]]+[0-9]+' android/app/build.gradle | head -1 | grep -oE '[0-9]+')
          NAME=$(grep -oE 'versionName[[:space:]]+"[^"]+"' android/app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          SIZE=$(stat -c%s apk/zhongtian-admin.apk)
          SHA=$(sha256sum apk/zhongtian-admin.apk | cut -d' ' -f1)
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "size": %s,\n  "sha256": "%s",\n  "builtAt": "%s",\n  "url": "https://zangxiaohei.github.io/zangxiaoheih.github.io/apk/zhongtian-admin.apk"\n}\n' \
            "$CODE" "$NAME" "$SIZE" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > apk/version.json
          cat apk/version.json

      - name: 提交 APK 到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk/zhongtian-admin.apk apk/version.json
          git diff --cached --quiet || git commit -m "更新安卓安装包 apk/zhongtian-admin.apk + version.json"
          git push

      # 注意：GITHUB_TOKEN 的 push 不会触发其他工作流，
      # 所以部署 Pages 必须在本工作流内完成，否则新 APK 不会上线
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点（含最新 APK）
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布 Pages
        id: deployment
        uses: actions/deploy-pages@v4
