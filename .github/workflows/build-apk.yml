name: build-apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 编译 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/zhongtian-admin.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zhongtian-admin-apk
          path: android/app/build/outputs/apk/debug/zhongtian-admin.apk

      - name: 发布到 Release（直链下载，无需登录）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 中天后台 APK（最新版）
          body: |
            安卓安装包（WebView 壳 + 原生角标通知服务）。
            下载后在手机上点开安装，首次打开需允许「通知」权限，角标才会显示。
          files: android/app/build/outputs/apk/debug/zhongtian-admin.apk
          fail_on_unmatched_files: true
