name: build-apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 与 deploy-pages 同一组串行，避免同时发布互相取消；
# 这里绝不能用 cancel-in-progress: true —— 同一次推送里 deploy-pages 先起跑，
# 会把正在编译的 APK 任务直接掐死（曾经因此拿不到新包）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 编译 debug APK（固定签名 zt-release.keystore）
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/zhongtian-admin.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zhongtian-admin-apk
          path: android/app/build/outputs/apk/debug/zhongtian-admin.apk

      - name: 放进站点目录（走自己的域名下载，国内更稳）
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/zhongtian-admin.apk apk/zhongtian-admin.apk
          ls -lh apk/

      - name: 提交 APK 到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk/zhongtian-admin.apk
          git diff --cached --quiet || git commit -m "更新安卓安装包 apk/zhongtian-admin.apk"
          git push

      # 注意：GITHUB_TOKEN 的 push 不会触发其他工作流，
      # 所以部署 Pages 必须在本工作流内完成，否则新 APK 不会上线
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点（含最新 APK）
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布 Pages
        id: deployment
        uses: actions/deploy-pages@v4
