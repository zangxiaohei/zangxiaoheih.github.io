plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhongtian.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhongtian.admin"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    /* 固定签名：所有构建（debug/release）用同一个密钥库，
       保证云端每次编译出的 APK 签名一致 → 手机上直接覆盖安装升级，无需卸载 */
    signingConfigs {
        appSign {
            storeFile file("zt-release.keystore")
            storePassword "zt2026admin"
            keyAlias "zhongtian"
            keyPassword "zt2026admin"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.appSign
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.appSign
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ShortcutBadger：适配小米/华为/荣耀/OPPO/vivo/三星等厂商桌面的私有角标接口
// （国产桌面不认标准通知的 setNumber，必须调各家 API 才亮角标）
dependencies {
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
}
