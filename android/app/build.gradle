plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhongtian.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhongtian.admin"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "1.15"
    }

    /* 固定签名：所有构建（debug/release）用同一个密钥库，
       保证云端每次编译出的 APK 签名一致 → 手机上直接覆盖安装升级，无需卸载 */
    signingConfigs {
        appSign {
            storeFile file("zt-release.keystore")
            storePassword "zt2026admin"
            keyAlias "zhongtian"
            keyPassword "zt2026admin"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.appSign
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.appSign
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// v1.5 起不再依赖 ShortcutBadger：它维护的是 2014–2017 年 ROM 的反射表，
// 在 MIUI 12+/HarmonyOS/ColorOS 上早已全部失效。改为官方通知角标（唯一有效路径）
// + 自己实现的厂商私有通道兜底（见 BadgeService.applyVendorBadge）。
dependencies {
}
