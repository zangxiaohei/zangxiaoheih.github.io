plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhongtian.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhongtian.admin"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            // debug 包即可直接安装，签名用系统调试证书
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ShortcutBadger：适配小米/华为/荣耀/OPPO/vivo/三星等厂商桌面的私有角标接口
// （国产桌面不认标准通知的 setNumber，必须调各家 API 才亮角标）
dependencies {
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
}
