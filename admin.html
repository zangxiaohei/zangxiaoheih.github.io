<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>中天后台管理</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px;
         font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
         background:linear-gradient(135deg,#0b4a63 0%,#0f766e 100%); color:#fff; }
  .card { width:100%; max-width:400px; padding:36px 26px; }
  .mark { width:52px; height:52px; margin:0 auto 18px; border-radius:14px;
          background:rgba(255,255,255,.14); display:grid; place-items:center; font-size:22px; }
  h1 { font-size:20px; margin:0 0 8px; letter-spacing:.5px; }
  p { margin:0 0 24px; color:rgba(255,255,255,.78); font-size:14px; line-height:1.7; }
  a.btn { display:block; background:#2dd4bf; color:#06342e; font-weight:700; text-decoration:none;
          padding:14px 20px; border-radius:12px; font-size:16px; }
  a.btn:active { transform:scale(.99); }
  a.back { display:inline-block; margin-top:20px; color:rgba(255,255,255,.6); font-size:13px;
           text-decoration:none; border-bottom:1px solid rgba(255,255,255,.25); padding-bottom:2px; }
  small { display:block; margin-top:16px; color:rgba(255,255,255,.45); font-size:12px; }
</style>
<script>
  /* 后台已迁移到独立应用目录 admin-app/，此页仅做兼容跳转 */
  var ADMIN = "admin-app/index.html";
  var target = ADMIN + (location.search || "") + (location.hash || "");
</script>
</head>
<body>
  <div class="card">
    <div class="mark">🔒</div>
    <h1>后台管理登录</h1>
    <p>正在前往管理后台…<br>若浏览器没有反应，请点击下面的按钮。</p>
    <a class="btn" id="go" href="#">进入管理后台</a>
    <a class="back" href="index.html">← 返回官方网站</a>
    <small>此页面仅供管理员使用</small>
  </div>
<script>
  document.getElementById("go").href = target;
  setTimeout(function () { location.replace(target); }, 500);
</script>
</body>
</html>
