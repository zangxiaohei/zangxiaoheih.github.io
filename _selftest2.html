<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>selftest</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/chat.css?v=2026110413" />
</head>
<body>
<script src="assets/data/site.js"></script>
<script src="assets/js/db-config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/chat.js?v=2026110413"></script>
<script>
window.addEventListener("load", function () {
  setTimeout(function () {
    var out = {};
    try {
      var fab = document.querySelector(".chat-fab");
      var panel = document.querySelector(".chat-panel");
      var closeBtn = document.querySelector('.chat-panel .x[aria-label="关闭"]');
      var newBtn = document.querySelector(".chat-panel .chat-new");
      out.closeBtnExists = !!closeBtn;
      out.newBtnExists = !!newBtn;
      /* 1. 打开聊天框 */
      fab.click();
      out.opened = panel.classList.contains("open");
      /* 2. 高度断言：顶部应到达页面中线或以上 */
      var rect = panel.getBoundingClientRect();
      var vh = window.innerHeight;
      out.viewportH = vh;
      out.panelTop = Math.round(rect.top);
      out.panelH = Math.round(rect.height);
      out.reachMiddle = rect.top <= vh / 2 + 1;
      /* 3. 点击关闭键 */
      closeBtn.click();
      out.closedAfterX = !panel.classList.contains("open");
      /* 4. 再打开，点击新会话按钮（应弹 confirm，这里 mock 掉） */
      window.confirm = function () { return false; };
      fab.click();
      newBtn.click();
      out.newBtnNoClose = panel.classList.contains("open");
    } catch (e) { out.error = String(e); }
    document.title = "RESULT:" + JSON.stringify(out);
    var pre = document.createElement("pre");
    pre.id = "result";
    pre.textContent = document.title;
    document.body.appendChild(pre);
  }, 600);
});
</script>
</body>
</html>
