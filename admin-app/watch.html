<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07120e">
<meta name="robots" content="noindex,nofollow">
<title>监控台 · 后台登录</title>
<style>
  :root { color-scheme: dark; --bg:#07120e; --panel:#0e211a; --panel2:#132a21; --line:#1e3a2e;
    --ink:#e9f6ef; --dim:#8fb3a4; --dim2:#658a79; --grn:#35d08a; --red:#ff5b5b; --amber:#f0b64a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; padding: 0 0 34px; color: var(--ink);
    font: 15px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  /* ---------------- 顶栏 ---------------- */
  .hd { position: sticky; top: 0; z-index: 50; background: rgba(7,18,14,.92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); padding: calc(11px + env(safe-area-inset-top, 0px)) 14px 11px; }
  .hd .in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .hd .title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  .hd .title .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: 0 0 8px;
    animation: bp 1.5s ease-out infinite; }
  .hd .title .rec.idle { background: #3c5a4d; animation: none; }
  @keyframes bp { 0%{box-shadow:0 0 0 0 rgba(255,91,91,.55)} 70%{box-shadow:0 0 0 7px rgba(255,91,91,0)} 100%{box-shadow:0 0 0 0 rgba(255,91,91,0)} }
  .hd .sub { font-size: 11.8px; color: var(--dim2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hd .sp { flex: 1; }
  .hd button { border: 1px solid var(--line); background: var(--panel2); color: #cfe8dc;
    border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .hd button:active { background: #1b3a2d; }
  .hd button.primary { background: #1a4d38; border-color: #256a4d; color: #eafff5; font-weight: 700; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 14px; }

  /* ---------------- 画面墙 ---------------- */
  .wall-hd { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim);
    margin: 2px 2px 9px; letter-spacing: .3px; }
  .wall-hd b { color: #d8f3e6; font-weight: 700; font-size: 13px; }
  .wall-hd .n { margin-left: auto; color: var(--dim2); font-variant-numeric: tabular-nums; }
  .wall-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 620px) { .wall-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 920px) { .wall-grid { grid-template-columns: repeat(3, 1fr); } }

  .cam { position: relative; border-radius: 14px; overflow: hidden; background: #06160f;
    border: 1px solid var(--line); aspect-ratio: 4 / 3; }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 18px; color: #6e9484; font-size: 12.6px; line-height: 1.75; }
  .cam .ph .spin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #23483a;
    border-top-color: var(--grn); margin: 0 auto 10px; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .cam .tag { position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,.5); border-radius: 99px; padding: 3px 9px; font-size: 11px; color: #eafff5;
    backdrop-filter: blur(6px); max-width: calc(100% - 16px); }
  .cam .tag .d { width: 5px; height: 5px; border-radius: 50%; background: var(--red); flex: 0 0 5px;
    animation: bp 1.5s ease-out infinite; }
  .cam .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cam .bt { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
  .cam .bt button { border: 0; border-radius: 99px; padding: 5px 11px; font: inherit; font-size: 11.5px;
    font-weight: 700; cursor: pointer; background: rgba(255,255,255,.16); color: #fff; backdrop-filter: blur(6px); }
  .cam .bt button.z { background: rgba(0,0,0,.45); }
  .cam .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px;
    background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0)); font-size: 11.5px;
    color: #dff3e9; display: flex; align-items: baseline; gap: 7px; }
  .cam .meta .nm { font-weight: 700; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cam .meta .tm { color: #9dc4b2; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .cam.has-face { cursor: zoom-in; }

  /* 一路画面都没到时收成一条，别让转圈占满首屏 */
  .idle-tip { display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px dashed var(--line); border-radius: 13px; padding: 13px 14px;
    font-size: 12.4px; color: var(--dim2); line-height: 1.6; }
  .idle-tip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: 0 0 8px;
    animation: bp2 2s ease-out infinite; }
  @keyframes bp2 { 0%{box-shadow:0 0 0 0 rgba(240,182,74,.5)} 70%{box-shadow:0 0 0 6px rgba(240,182,74,0)} 100%{box-shadow:0 0 0 0 rgba(240,182,74,0)} }
  .idle-tip .tx { flex: 1; min-width: 0; }
  .idle-tip .tx b { display: block; color: #dcefe5; font-size: 13px; margin-bottom: 2px; }
  .idle-tip button { flex: 0 0 auto; border: 1px solid #5c4a24; background: #2b2415; color: #e8c176;
    border-radius: 9px; padding: 6px 11px; font: inherit; font-size: 11.8px; font-weight: 700; cursor: pointer; }
  .idle-tip button:active { background: #3a301a; }

  /* ---------------- 设备行 ---------------- */
  .sec { margin-top: 22px; }
  .sec-hd { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px;
    font-size: 13px; font-weight: 700; color: #cbe6d9; }
  .sec-hd .n { margin-left: auto; font-size: 11.8px; font-weight: 400; color: var(--dim2); }

  .dev { display: flex; gap: 11px; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; margin-bottom: 9px; }
  .dev .av { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 13px; overflow: hidden;
    background: #17352a; display: grid; place-items: center; position: relative; }
  .dev .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dev .av .ini { font-size: 17px; font-weight: 700; color: #9fe0c2; text-transform: uppercase; }
  .dev .av.live { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--red); }
  .dev .av.face { cursor: zoom-in; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px #2c7a58; }
  .dev .m { flex: 1; min-width: 0; }
  .dev .m .e { font-size: 14.2px; font-weight: 700; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .dev .m .d { font-size: 11.9px; color: var(--dim2); margin-top: 3px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .dev .m .d2 { font-size: 11.6px; color: #7fa694; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .dev .act { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .dev .st { font-size: 10.8px; font-weight: 700; border-radius: 99px; padding: 3px 8px; white-space: nowrap;
    background: rgba(53,208,138,.14); color: var(--grn); }
  .dev .st.away { background: rgba(240,182,74,.14); color: var(--amber); }
  .dev .st.off { background: #1b2c25; color: #6d8b7e; }
  .dev .act button { border: 1px solid #2a5744; background: #143326; color: #a9e6cb; border-radius: 9px;
    padding: 5px 10px; font: inherit; font-size: 11.6px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .dev .act button.stop { border-color: #6d3330; background: #2c1a18; color: #ff9b93; }
  .dev .act button.wait { border-color: #5c4a24; background: #2b2415; color: #e8c176; }
  .dev .act button:disabled { opacity: .55; }

  /* ---------------- 登录流水 ---------------- */
  .log { display: flex; gap: 10px; padding: 9px 12px; border-radius: 11px; background: var(--panel);
    border: 1px solid #16281f; margin-bottom: 7px; border-left: 2.5px solid #2f6b4f; }
  .log.bad { border-left-color: #8e3a34; background: #160f0e; }
  .log.newn { border-left-color: #8a6a25; }
  .log .t { flex: 0 0 42px; font-size: 11.4px; color: var(--dim2); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .log .m { flex: 1; min-width: 0; }
  .log .m .l1 { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .m .l2 { font-size: 11.4px; color: var(--dim2); margin-top: 2px; }
  .log .b { flex: 0 0 auto; font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 2px 6px;
    align-self: flex-start; margin-top: 1px; background: rgba(53,208,138,.13); color: var(--grn); }
  .log.bad .b { background: rgba(255,91,91,.14); color: #ff9b93; }
  .log.newn .b { background: rgba(240,182,74,.14); color: var(--amber); }

  .empty { text-align: center; color: var(--dim2); font-size: 13px; padding: 26px 12px; line-height: 1.9;
    border: 1px dashed var(--line); border-radius: 14px; }
  .hint { margin-top: 10px; font-size: 11.6px; color: #5f8271; line-height: 1.8; }

  /* ---------------- 登录卡 ---------------- */
  .gate { max-width: 380px; margin: 8vh auto 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 22px 20px; }
  .gate h1 { font-size: 18px; margin: 0 0 4px; }
  .gate p { margin: 0 0 16px; font-size: 12.8px; color: var(--dim2); line-height: 1.7; }
  .gate label { display: block; font-size: 12px; color: var(--dim); margin: 11px 0 5px; }
  .gate input { width: 100%; background: #0a1a13; border: 1px solid #23483a; color: var(--ink);
    border-radius: 11px; padding: 11px 12px; font: inherit; font-size: 15px; outline: none; }
  .gate input:focus { border-color: #2f7a57; }
  .gate button { width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 12px;
    font: inherit; font-size: 15px; font-weight: 700; background: var(--grn); color: #04140d; cursor: pointer; }
  .gate button:disabled { opacity: .7; }
  .gate .err { font-size: 12.4px; color: #ff9b93; margin-top: 10px; min-height: 16px; }

  /* ---------------- 大图 ---------------- */
  .lb { position: fixed; inset: 0; z-index: 999; background: rgba(2,9,6,.97); display: grid;
    place-items: center; padding: 14px; }
  .lb[hidden] { display: none; }
  .lb img { max-width: min(760px, 96vw); max-height: 74vh; border-radius: 12px; background: #0a1a13;
    box-shadow: 0 26px 70px rgba(0,0,0,.6); }
  .lb .meta { color: #cfe8dc; font-size: 12.5px; text-align: center; margin-top: 12px; line-height: 1.85; }
  .lb .x { position: fixed; top: calc(12px + env(safe-area-inset-top,0px)); right: 13px; width: 38px; height: 38px;
    border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<div class="hd">
  <div class="in">
    <div>
      <div class="title"><span class="rec idle" id="rec"></span>监控台 · 后台登录</div>
      <div class="sub" id="sub">连接中…</div>
    </div>
    <div class="sp"></div>
    <button id="btn-all" class="primary" hidden>全部看看</button>
    <button id="btn-out" hidden>退出</button>
  </div>
</div>

<div class="wrap">

  <!-- 未登录 -->
  <div class="gate" id="gate" hidden>
    <h1>监控台</h1>
    <p>用后台管理员账号登录。登录后这里会显示：谁正在用后台、用的是哪台设备，以及那台设备的摄像头画面。</p>
    <label for="em">邮箱</label>
    <input id="em" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com">
    <label for="pw">密码</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <button id="btn-in">进入监控台</button>
    <div class="err" id="gate-err"></div>
  </div>

  <div id="main" hidden>
    <!-- 画面墙 -->
    <div class="wall-hd"><b>实时画面</b><span id="wall-note"></span><span class="n" id="wall-cnt"></span></div>
    <div class="wall-grid" id="wall-grid"></div>

    <!-- 设备列表 -->
    <div class="sec">
      <div class="sec-hd">谁在用后台<i style="width:6px;height:6px;border-radius:50%;background:#35d08a;display:inline-block" id="adm-dot"></i>
        <span class="n" id="adm-cnt"></span>
      </div>
      <div id="dev-list"><div class="empty">读取中…</div></div>
      <div class="hint">画面只有本人在那台设备上点过「允许」才会传过来；浏览器不允许网页偷偷开摄像头。对方点「停止」，这边立刻黑屏。</div>
    </div>

    <!-- 登录流水 -->
    <div class="sec">
      <div class="sec-hd">登录流水<span class="n" id="log-cnt"></span></div>
      <div id="log-list"><div class="empty">读取中…</div></div>
    </div>
  </div>
</div>

<div class="lb" id="lb" hidden>
  <button class="x" id="lb-x" aria-label="关闭">✕</button>
  <div>
    <img id="lb-img" alt="画面">
    <div class="meta" id="lb-meta"></div>
  </div>
</div>

<script src="../assets/js/db-config.js?v=2026110534"></script>
<script src="../assets/vendor/supabase.min.js?v=2026110516"></script>
<script>
(function () {
  "use strict";

  var cfg = window.SUPABASE_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var p2 = function (n) { return (n < 10 ? "0" : "") + n; };
  function hhmmss(d) { d = d || new Date(); return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds()); }
  function ago(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "—";
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 15) return "刚刚";
    if (s < 60) return s + " 秒前";
    if (s < 3600) return Math.round(s / 60) + " 分钟前";
    if (s < 86400) return Math.round(s / 3600) + " 小时前";
    return Math.round(s / 86400) + " 天前";
  }
  function stay(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "不到 1 分钟";
    if (m < 60) return m + " 分钟";
    var h = Math.floor(m / 60), r = m % 60;
    return h + " 小时" + (r ? " " + r + " 分" : "");
  }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    var now = new Date(), y = new Date(now.getTime() - 864e5);
    if (d.toDateString() === now.toDateString()) return hhmmss(d).slice(0, 5);
    if (d.toDateString() === y.toDateString()) return "昨天";
    return (d.getMonth() + 1) + "/" + d.getDate();
  }

  var ONLINE = 90 * 1000, AWAY = 10 * 60 * 1000;
  function state(r) {
    var t = new Date(r.last_at).getTime();
    if (Date.now() - t <= ONLINE) return "on";
    if (Date.now() - t <= AWAY) return "away";
    return "off";
  }
  function shortId(id) { return String(id).replace(/-/g, "").slice(0, 12); }

  var client = null;
  if (cfg.url && cfg.anonKey) {
    try { client = window.supabase.createClient(cfg.url, cfg.anonKey); } catch (e) { client = null; }
  }

  /* ==================================================================
     实时画面：指令走 zt-cam-hub，画面走 zt-live-<设备号>
     访客/管理员的设备只有被订阅的那一路才推，互相看不到
     ================================================================== */
  var hub = null, live = {}, frame = {}, wallSig = "", lbId = null;

  function startHub() {
    if (hub || !client) return;
    try { hub = client.channel("zt-cam-hub", { config: { broadcast: { self: false } } }); }
    catch (e) { hub = null; return; }
    hub.on("broadcast", { event: "bye" }, function (msg) {
      var sid = String((msg && msg.payload && msg.payload.id) || "");
      if (!sid) return;
      var hit = false;
      Object.keys(live).forEach(function (id) {
        if (shortId(id) !== sid) return;
        if (live[id]) { live[id].ended = true; live[id].last = 0; }
        delete frame[id];
        hit = true;
      });
      if (hit) { wallSig = ""; render(); }
    });
    hub.subscribe();
  }

  function cmd(id, on) {
    if (!hub) startHub();
    if (!hub) return;
    try {
      hub.send({ type: "broadcast", event: "live", payload: { id: shortId(id), on: !!on } });
    } catch (e) {}
  }

  function watch(id) {
    if (live[id] || !client) return;
    startHub();
    var ch = null;
    try { ch = client.channel("zt-live-" + shortId(id), { config: { broadcast: { self: false } } }); }
    catch (e) { return; }
    live[id] = { ch: ch, last: 0, t0: Date.now(), ended: false, seen: false };
    ch.on("broadcast", { event: "frame" }, function (msg) {
      var p = (msg && msg.payload) || {};
      if (String(p.id || "") !== shortId(id)) return;
      onFrame(id, p.img);
    });
    ch.on("broadcast", { event: "bye" }, function () {
      var w = live[id];
      if (w) { w.ended = true; w.last = 0; }
      delete frame[id];
      wallSig = "";
      render();
    });
    ch.subscribe();
    cmd(id, true);
    saveWatch();
    render();
  }

  function unwatch(id, tell) {
    var w = live[id];
    if (!w) return;
    delete live[id];
    delete frame[id];
    try { w.ch.unsubscribe(); } catch (e) {}
    if (tell !== false) cmd(id, false);
    saveWatch();
    render();
  }

  function onFrame(id, img) {
    if (!img || typeof img !== "string" || img.slice(0, 11) !== "data:image/") return;
    var w = live[id];
    if (!w) return;
    w.last = Date.now();
    w.ended = false;
    frame[id] = img;
    var im = document.querySelectorAll('[data-cam="' + id + '"] img');
    for (var i = 0; i < im.length; i++) if (im[i].getAttribute("src") !== img) im[i].src = img;
    if (!$("lb").hidden && lbId === id) $("lb-img").src = img;
    if (!w.seen) { w.seen = true; wallSig = ""; render(); }
  }

  var WATCH_KEY = "zt_watch_dev";
  function saveWatch() {
    try { localStorage.setItem(WATCH_KEY, JSON.stringify(Object.keys(live))); } catch (e) {}
  }

  /* ==================================================================
     数据
     ================================================================== */
  var rows = [], logs = [], thumbs = {}, thumbCursor = "1970-01-01T00:00:00+00:00";
  var timer = null, deadTable = false, askedOnce = {}, autoOnce = false;

  function load() {
    if (!client) return;
    var since = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
    client.from("site_presence")
      .select("id,kind,name,page,device,ip,screen,first_at,last_at,cam,photo_at,ask")
      .eq("kind", "admin")
      .gte("last_at", since)
      .order("last_at", { ascending: false })
      .limit(30)
      .then(function (res) {
        if (res && res.error) {
          var code = String(res.error.code || "");
          if (code === "42P01") { deadTable = true; }
          rows = [];
        } else {
          deadTable = false;
          rows = (res.data || []);
        }
        return client.from("admin_login_log")
          .select("id,email,ok,ip,device,city,is_new,logged_at")
          .order("logged_at", { ascending: false })
          .limit(40);
      })
      .then(function (res2) {
        logs = (res2 && !res2.error && res2.data) ? res2.data : [];
        hasLogTable = !(res2 && res2.error);
        syncThumbs();
        render();
        autoAsk();
        if (!autoOnce && !Object.keys(live).length) { autoOnce = true; autoWatch(); }
      })
      .catch(function () { $("sub").textContent = "网络异常，自动重试中"; });
  }
  var hasLogTable = true;

  /* 只取有更新的缩略图（照片列很大，绝不整表拉） */
  function syncThumbs() {
    client.from("site_presence")
      .select("id,thumb,photo_at")
      .eq("kind", "admin")
      .gt("photo_at", thumbCursor)
      .limit(60)
      .then(function (res) {
        if (res && res.error) return;
        var max = thumbCursor;
        (res.data || []).forEach(function (x) {
          if (x.thumb) thumbs[x.id] = x.thumb;
          if (x.photo_at && x.photo_at > max) max = x.photo_at;
        });
        thumbCursor = max;
        render();
      })
      .catch(function () {});
  }

  /* 自动：在线设备没授权过就替他发一次「请求看画面」，让他下一次心跳弹卡 */
  function autoAsk() {
    rows.forEach(function (r) {
      if (state(r) !== "on") return;
      if (r.cam === "on" || r.cam === "deny") return;
      if (askedOnce[r.id]) return;
      askedOnce[r.id] = 1;
      client.from("site_presence").update({ ask: true }).eq("id", r.id).then(function () {}).catch(function () {});
    });
  }

  /* 自动开看：在线的、没拒绝过的，最多 6 路，进来就有画面 */
  function autoWatch() {
    var on = rows.filter(function (r) { return state(r) === "on"; });
    if (!on.length) return;
    var n = Object.keys(live).length;
    on.forEach(function (r) {
      if (n >= 6) return;
      if (live[r.id]) return;
      if (r.cam === "deny") return;
      watch(r.id);
      n++;
    });
  }

  /* ==================================================================
     渲染
     ================================================================== */
  function nameOf(id) {
    for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i].name || "管理员";
    return "管理员";
  }

  function render() {
    if ($("main").hidden) return;
    var on = rows.filter(function (r) { return state(r) === "on"; });
    var ids = Object.keys(live);
    var got = ids.filter(function (k) { return !!frame[k]; }).length;

    /* 顶栏 */
    var endedN = ids.filter(function (k) { return live[k] && live[k].ended; }).length;
    var head;
    if (got) head = "正在看 " + got + " 台";
    else if (ids.length && endedN === ids.length) head = "对方已停止共享";
    else if (ids.length) head = "等待对方在设备上点「允许」";
    else if (on.length) head = on.length + " 台在后台，未接入画面";
    else head = "暂无人在后台";
    $("rec").className = "rec" + (got ? "" : " idle");
    $("sub").textContent = head + " · " + hhmmss();

    /* 画面墙：有画面的排前面，等待中的排后面 */
    var wallIds = ids.slice().sort(function (a, b) {
      return (frame[b] ? 1 : 0) - (frame[a] ? 1 : 0);
    });
    if (!wallIds.length && on.length) wallIds = on.slice(0, 3).map(function (r) { return r.id; });

    $("wall-cnt").textContent = ids.length ? got + " / " + ids.length + " 路在传" : (on.length ? on.length + " 台在线" : "");
    $("wall-note").textContent = ids.length ? "" : (on.length ? "（画面需要对方在设备上点「允许」）" : "");

    var sig = wallIds.join("|") + "#" + (got ? "live" : (ids.length ? "wait" : "none"));
    if (sig !== wallSig) {
      wallSig = sig;
      if (!wallIds.length) {
        $("wall-grid").innerHTML = '<div class="idle-tip">现在没有人登录后台。有人用手机或电脑打开后台，这里会立刻出现画面。</div>';
      } else if (!got && ids.length) {
        /* 一路画面都还没到：不摆一排转圈占满首屏，收成一条，把设备列表顶上来 */
        $("wall-grid").innerHTML =
          '<div class="idle-tip"><span class="dot"></span>' +
          '<span class="tx"><b>' + ids.length + ' 台设备正在等对方点「允许」</b>' +
          '摄像头必须由本人在那台设备上确认，浏览器不允许网页偷偷开。</span>' +
          '<button type="button" id="tip-again">再请求一次</button></div>';
      } else {
        $("wall-grid").innerHTML = wallIds.map(function (id) {
          var f = frame[id];
          var r = findRow(id) || {};
          var body = f
            ? '<img src="' + esc(f) + '" alt="实时画面">'
            : '<div class="ph"><div><div class="spin"></div>' + phText(id) + '</div></div>';
          return '<div class="cam' + (f ? ' has-face' : '') + '" data-cam="' + esc(id) + '">' +
            body +
            '<div class="meta"><span class="nm">' + esc(nameOf(id)) + '</span>' +
              '<span class="tm">' + esc(r.device || "") + '</span></div>' +
          '</div>';
        }).join("");
      }
    }

    /* 每帧只换 src / 名字（不整墙重建，1fps 也不闪） */
    wallIds.forEach(function (id) {
      var c = document.querySelector('.cam[data-cam="' + id + '"]');
      if (!c) return;
      if (frame[id]) {
        var ph = c.querySelector(".ph");
        if (ph) {
          var im = document.createElement("img");
          im.src = frame[id]; im.alt = "实时画面";
          c.replaceChild(im, ph);
          c.classList.add("has-face");
        }
      }
      var nm = c.querySelector(".nm");
      if (nm) nm.textContent = nameOf(id);
    });

    /* 设备列表 */
    $("adm-cnt").textContent = on.length ? on.length + " 台在线" : (rows.length ? "近 24 小时 " + rows.length + " 台" : "");
    $("adm-dot").style.background = on.length ? "#35d08a" : "#3c5a4d";

    if (deadTable) {
      $("dev-list").innerHTML = '<div class="empty">还看不到设备：需要在 Supabase 跑一次 admin/presence.sql。</div>';
    } else if (!rows.length) {
      $("dev-list").innerHTML = '<div class="empty">近 24 小时没有人登录过后台。<br>用手机打开后台登录一次，这里马上会多一行。</div>';
    } else {
      $("dev-list").innerHTML = rows.map(devRow).join("");
    }

    /* 登录流水 */
    if (!hasLogTable) {
      $("log-list").innerHTML = '<div class="empty">登录流水还没装：在 Supabase 跑一次 admin/login-watch.sql。<br>（在线状态和画面不受影响）</div>';
      $("log-cnt").textContent = "";
    } else if (!logs.length) {
      $("log-list").innerHTML = '<div class="empty">还没有登录记录。</div>';
      $("log-cnt").textContent = "";
    } else {
      $("log-list").innerHTML = logs.map(logRow).join("");
      $("log-cnt").textContent = "最近 " + logs.length + " 条";
    }
  }

  function findRow(id) {
    for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];
    return null;
  }

  function phText(id) {
    var w = live[id];
    if (!w) return "未连接";
    if (w.ended) return "对方已停止共享";
    if (w.last && Date.now() - w.last > 8000) return "信号中断，" + Math.round((Date.now() - w.last) / 1000) + " 秒未收到画面<br>正在重连…";
    var el = Math.round((Date.now() - w.t0) / 1000);
    if (el > 12) return "对方还没点「允许」<br>在他的设备上确认一下";
    return "正在唤醒摄像头…";
  }

  function devRow(r) {
    var st = state(r);
    var id = r.id;
    var liveOn = !!live[id];
    var img = frame[id] || thumbs[id] || "";
    var cls = "av" + (frame[id] ? " live" : (img ? " face" : ""));
    var act = "";
    if (liveOn) {
      act = live[id].ended
        ? '<button data-live="' + esc(id) + '">重新看</button>'
        : (frame[id]
            ? '<button class="stop" data-stop="' + esc(id) + '">停止</button>'
            : '<button class="stop" data-stop="' + esc(id) + '">取消</button>');
    } else if (r.cam === "on") {
      act = '<button data-live="' + esc(id) + '">看画面</button>';
    } else if (r.cam === "deny") {
      act = '<button class="wait" data-ask="' + esc(id) + '">再请求一次</button>';
    } else {
      act = '<button data-ask="' + esc(id) + '"' + (r.ask ? " disabled" : "") + '>' +
            (r.ask ? "已请求…" : "请求看画面") + '</button>';
    }
    var d = [];
    if (r.device) d.push(esc(r.device));
    if (r.ip) d.push(esc(r.ip));
    var d2 = [];
    d2.push(st === "on" ? "已用 " + stay(r.first_at) : ago(r.last_at));
    if (r.photo_at) d2.push("留影 " + when(r.photo_at));
    if (r.cam === "on") d2.push("已允许");
    if (r.cam === "deny") d2.push("已拒绝");

    return '<div class="dev">' +
      '<div class="' + cls + '"' + (img ? ' data-face="' + esc(id) + '"' : '') + '>' +
        (img ? '<img src="' + esc(img) + '" alt="画面">' : '<span class="ini">' + esc(String(r.name || "A").slice(0, 1)) + '</span>') +
      '</div>' +
      '<div class="m">' +
        '<div class="e">' + esc(r.name || "管理员") + '</div>' +
        '<div class="d">' + (d.join(" · ") || "—") + '</div>' +
        '<div class="d2">' + d2.join(" · ") + '</div>' +
      '</div>' +
      '<div class="act">' +
        '<span class="st ' + (st === "on" ? "" : st === "away" ? "away" : "off") + '">' +
          (st === "on" ? "在线" : st === "away" ? "离开" : "离线") + '</span>' +
        act +
      '</div>' +
    '</div>';
  }

  function logRow(r) {
    var cls = r.ok === false ? "bad" : (r.is_new ? "newn" : "");
    var tag = r.ok === false ? "密码错误" : (r.is_new ? "新 IP" : "正常");
    var l2 = [];
    if (r.device) l2.push(esc(r.device));
    if (r.ip) l2.push(esc(r.ip) + (r.city ? " " + esc(r.city) : ""));
    return '<div class="log ' + cls + '">' +
      '<div class="t">' + when(r.logged_at) + '</div>' +
      '<div class="m"><div class="l1">' + esc(r.email || "未知账号") + '</div>' +
        '<div class="l2">' + (l2.join(" · ") || "—") + '</div></div>' +
      '<div class="b">' + tag + '</div>' +
    '</div>';
  }

  /* ==================================================================
     交互
     ================================================================== */
  $("wall-grid").addEventListener("click", function (e) {
    if (e.target.closest("#tip-again")) { requestAll(); return; }
    var c = e.target.closest("[data-cam]");
    if (!c) return;
    openBig(c.getAttribute("data-cam"));
  });
  $("dev-list").addEventListener("click", function (e) {
    var face = e.target.closest("[data-face]");
    if (face) { openBig(face.getAttribute("data-face")); return; }

    var b = e.target.closest("button[data-live]");
    if (b) { watch(b.getAttribute("data-live")); return; }

    var s = e.target.closest("button[data-stop]");
    if (s) { unwatch(s.getAttribute("data-stop")); return; }

    var a = e.target.closest("button[data-ask]");
    if (!a) return;
    var id = a.getAttribute("data-ask");
    a.disabled = true;
    a.textContent = "已请求…";
    askedOnce[id] = 1;
    client.from("site_presence").update({ ask: true }).eq("id", id).then(function (res) {
      if (res && res.error) { a.disabled = false; a.textContent = "失败，重试"; }
    }).catch(function () { a.disabled = false; a.textContent = "失败，重试"; });
  });

  function openBig(id) {
    lbId = id;
    var r = findRow(id) || {};
    var f = frame[id] || thumbs[id] || "";
    if (!f) { watch(id); return; }
    $("lb-img").src = f;
    var extra = frame[id]
      ? '<br><span style="color:#ff9b93">● 实时画面 · 关掉这个窗口不会停止共享</span>'
      : (r.photo_at ? "<br>拍摄于 " + esc(when(r.photo_at)) : "");
    $("lb-meta").innerHTML = esc(r.name || "管理员") + "<br>" +
      esc(r.device || "未知设备") + " · " + esc(r.ip || "-") + extra;
    $("lb").hidden = false;
  }
  function closeBig() { $("lb").hidden = true; lbId = null; $("lb-img").src = ""; }
  $("lb-x").addEventListener("click", closeBig);
  $("lb").addEventListener("click", function (e) { if (e.target === this || e.target.id === "lb-img") closeBig(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeBig(); });

  $("btn-all").addEventListener("click", function () {
    var b = this;
    var n = requestAll();
    if (!n) {
      b.textContent = "没有可看的设备";
      setTimeout(function () { b.textContent = "全部看看"; }, 1800);
      return;
    }
    b.textContent = "已请求 " + n + " 台…";
    setTimeout(function () { b.textContent = "全部看看"; }, 2000);
  });

  /* 对在线、没拒绝过的设备统一发一次：已授权的直接开，没授权的一律请求 */
  function requestAll() {
    var on = rows.filter(function (r) { return state(r) === "on" && !live[r.id] && r.cam !== "deny"; });
    if (!on.length) return 0;
    on.slice(0, 6).forEach(function (r) {
      if (r.cam === "on") watch(r.id);
      else {
        askedOnce[r.id] = 1;
        client.from("site_presence").update({ ask: true }).eq("id", r.id).then(function () {}).catch(function () {});
      }
    });
    return Math.min(on.length, 6);
  }

  $("btn-out").addEventListener("click", function () {
    try { client.auth.signOut({ scope: "local" }); } catch (e) {}
    location.reload();
  });

  /* 页面切回来立刻刷新 + 重新对齐监控状态 */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !client) return;
    if (!$("main").hidden) { load(); setTimeout(autoWatch, 400); }
  });

  /* 4 秒重发指令：指令可能在对方还没连上频道时就发了 */
  setInterval(function () {
    Object.keys(live).forEach(function (id) {
      var w = live[id];
      if (!w || w.ended) return;
      if (Date.now() - (w.last || 0) > 9000) { w.seen = false; cmd(id, true); }
    });
  }, 4000);

  /* 5 秒刷新数据 */
  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () {
      if (document.hidden) return;
      load();
      if (!Object.keys(live).length) autoWatch();
    }, 5000);
  }

  /* ==================================================================
     启动
     ================================================================== */
  if (!client) {
    $("gate").hidden = false;
    $("gate-err").textContent = "没有配置数据库：请先在 assets/js/db-config.js 里填 Supabase 地址和 anon key。";
    return;
  }

  client.auth.getSession().then(function (res) {
    var s = res && res.data && res.data.session;
    if (s && s.user) start();
    else {
      $("sub").textContent = "需要管理员账号";
      $("gate").hidden = false;
      $("em").focus();
    }
  });

  $("btn-in").addEventListener("click", doIn);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") doIn(); });

  function doIn() {
    var em = $("em").value.trim(), pw = $("pw").value;
    if (!em || !pw) { $("gate-err").textContent = "请输入邮箱和密码。"; return; }
    $("btn-in").disabled = true;
    $("gate-err").textContent = "登录中…";
    client.auth.signInWithPassword({ email: em, password: pw }).then(function (r) {
      $("btn-in").disabled = false;
      if (r.error) {
        var m = String(r.error.message || "");
        $("gate-err").textContent = /fetch|network|timeout/i.test(m) ? "网络连接失败，检查网络后重试。" : "邮箱或密码错误。";
        return;
      }
      $("gate-err").textContent = "";
      $("gate").hidden = true;
      start();
    });
  }

  function start() {
    $("gate").hidden = true;
    $("main").hidden = false;
    $("btn-all").hidden = false;
    $("btn-out").hidden = false;
    startHub();

    /* 恢复上次开着的几路（同一台设备刷新后不用重新点） */
    var a = [];
    try { a = JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"); } catch (e) { a = []; }

    load();
    setTimeout(function () {
      (a || []).slice(0, 6).forEach(function (id) { if (typeof id === "string" && id) watch(id); });
      load();
    }, 500);
    setTimeout(autoWatch, 1600);
    startTimer();
  }
})();
</script>
</body>
</html>
